
services:
  agent:
    build: .
    container_name: terminal-coding-agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true

    environment:
      WORKSPACE: /workspace
      SANDBOX_URL: http://sandbox:8787
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}

    env_file:
      - .env

    volumes:
      - ./workspace:/workspace

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

    networks:
      - default
      - sandbox-net

  sandbox:
    build:
      context: ./sandbox
    container_name: terminal-agent-sandbox
    working_dir: /sandbox

    environment:
      PORT: "8787"
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}

    volumes:
      - ./workspace:/workspace

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64

    init: true
    restart: unless-stopped

    networks:
      - sandbox-net

networks:
  default:
  sandbox-net:
    internal: true
